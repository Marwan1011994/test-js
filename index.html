<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ahmed Mohamed Ahmed project4 JS</title>
    <link rel="stylesheet" href="CSS/style.css">
    <link rel="stylesheet" href="CSS/all.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <a class="navbar-brand" href="#">
            <img src="images/logo.png" alt="Logo" height="80">
        </a>
        <div class="ml-auto">
            <button class="btn btn-outline-primary" onclick="redirectTo('login.html')">Login</button>
            <button class="btn btn-outline-success" onclick="redirectTo('register.html')">Register</button>
        </div>
    </nav>
    <!-- Search Section -->
    <div class="container mt-5">
        <div class="row">
            <div class="col-md-3">
                <select id="searchType" class="form-control">
                    <option value="name">Search by Product Name</option>
                    <option value="category">Search by Category</option>
                </select>
            </div>
            <div class="col-md-7">
                <input type="text" id="searchBox" class="form-control" placeholder="Search..." onkeyup="searchProducts()">
            </div>
            <div class="col-md-2">
                <button class=" search-btn btn btn-block bg-dark text-light" onclick="searchProducts()">Search</button>
            </div>
        </div>
    </div>
    <!-- Products Cards -->
    <div class="container mt-5" id="products-container">
        <div class="row" id="products-row"></div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script  src="JS/script.js"></script>

</body>
</html>
